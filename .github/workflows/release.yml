name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test ./...
      - name: Build
        env: {VERSION: '${{ github.ref_name }}', COMMIT: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in 'linux amd64' 'linux arm64' 'windows amd64' 'darwin amd64' 'darwin arm64'; do
            read -r GOOS GOARCH <<< "$target"; suffix=""; [ "$GOOS" = windows ] && suffix=.exe
            name="gobbs-${GOOS}-${GOARCH}"; mkdir -p "dist/$name"
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -trimpath -buildvcs=true -ldflags "-X main.version=$VERSION -X main.commit=$COMMIT" -o "dist/$name/forumd$suffix" ./cmd/forumd
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -trimpath -buildvcs=true -ldflags "-X main.version=$VERSION" -o "dist/$name/gobbsctl$suffix" ./cmd/gobbsctl
            tar -C dist -czf "dist/$name.tar.gz" "$name"; rm -rf "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*'
