{{define "content"}}
<div id="ct" class="wp cl">
	<div class="mn auth-box">
		<div class="bm bmw">
			<div class="bm_h"><h2>注册账号</h2></div>
			<div class="bm_c">
				<form method="post" action="/register" class="auth-form">
					<input type="hidden" name="_csrf" value="{{.CSRF}}">
					<input type="hidden" name="next" value="{{.Next}}">
					{{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}
					<div class="form-row">
						<label for="username">用户名</label>
						<input type="text" name="username" id="username" class="px" value="{{.Username}}" required autofocus autocomplete="username" maxlength="15">
						<p class="xg1 tip">2-15 位中文、字母、数字或下划线</p>
					</div>
					<div class="form-row">
						<label for="email">邮箱（选填）</label>
						<input type="email" name="email" id="email" class="px" value="{{.Email}}" autocomplete="email">
					</div>
					<div class="form-row">
						<label for="password">密码</label>
						<input type="password" name="password" id="password" class="px" required autocomplete="new-password">
						<p class="xg1 tip">至少 6 位</p>
					</div>
					<div class="submit-row">
						<button type="submit" class="pn pnc">注册</button>
						<span class="xg1">已有账号？<a href="/login{{if .Next}}?next={{.Next}}{{end}}">直接登录</a></span>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
{{end}}
