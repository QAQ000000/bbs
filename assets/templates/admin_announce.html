{{define "content"}}
<div class="admin-head"><h2>公告管理</h2></div>

<div class="panel">
	<form method="post" action="/admin/announcements/add" class="cl" style="margin-bottom:12px">
		<input type="hidden" name="_csrf" value="{{.CSRF}}">
		<textarea name="content" class="px" rows="3" placeholder="公告内容，发布后展示在首页顶部" required style="margin-bottom:8px"></textarea>
		<button type="submit" class="pn pnc pn-sm">发布公告</button>
	</form>

	<table class="admin-table">
		<thead><tr><th>内容</th><th>发布人</th><th>时间</th><th>状态</th><th class="ops-cell">操作</th></tr></thead>
		<tbody>
		{{range .Announcements}}
		<tr>
			<td>{{.Content}}</td>
			<td class="xg1">{{.Author}}</td>
			<td class="xg1">{{timefmt .CreatedAt}}</td>
			<td>
				{{if .Enabled}}<span class="badge badge-digest">显示中</span>{{else}}<span class="xg1">已停用</span>{{end}}
			</td>
			<td class="ops-cell">
				<form method="post" action="/admin/announcements/toggle" class="inlineform">
					<input type="hidden" name="_csrf" value="{{$.CSRF}}">
					<input type="hidden" name="id" value="{{.ID}}">
					<input type="hidden" name="enabled" value="{{if .Enabled}}0{{else}}1{{end}}">
					<button type="submit" class="pn pn-sm">{{if .Enabled}}停用{{else}}启用{{end}}</button>
				</form>
				<form method="post" action="/admin/announcements/delete" class="inlineform" data-confirm="确定删除该公告吗？">
					<input type="hidden" name="_csrf" value="{{$.CSRF}}">
					<input type="hidden" name="id" value="{{.ID}}">
					<button type="submit" class="pn pn-sm pn-danger">删除</button>
				</form>
			</td>
		</tr>
		{{else}}
		<tr><td colspan="5" class="empty">暂无公告</td></tr>
		{{end}}
		</tbody>
	</table>
</div>
{{end}}
