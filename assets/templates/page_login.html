{{define "content"}}
<div id="ct" class="wp cl">
	<div class="mn auth-box">
		<div class="bm bmw">
			<div class="bm_h"><h2>登录 {{.SiteName}}</h2></div>
			<div class="bm_c">
				<form method="post" action="/login" class="auth-form">
					<input type="hidden" name="_csrf" value="{{.CSRF}}">
					<input type="hidden" name="next" value="{{.Next}}">
					{{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}
					<div class="form-row">
						<label for="username">用户名</label>
						<input type="text" name="username" id="username" class="px" required autofocus autocomplete="username">
					</div>
					<div class="form-row">
						<label for="password">密码</label>
						<input type="password" name="password" id="password" class="px" required autocomplete="current-password">
					</div>
					<div class="submit-row">
						<button type="submit" class="pn pnc">登录</button>
						<span class="xg1">还没有账号？<a href="/register{{if .Next}}?next={{.Next}}{{end}}">立即注册</a></span>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
{{end}}
