{{define "content"}}
<div id="pt" class="bm cl"><div class="z">
	<a href="/" class="nvhm">{{.SiteName}}</a> <em>›</em> <span>通知</span>
</div></div>

<div id="ct" class="wp cl">
	<div class="mn">
		<div class="bm bmw">
			<div class="bm_h"><h2>我的通知</h2></div>
			<div class="bm_c">
				{{if .Notifications}}
				<table class="list mini notify-list">
					{{range .Notifications}}
					<tr{{if not .Read}} class="unread"{{end}}>
						<th>
							{{if eq .Type "reply"}}<a href="{{threadURL .ThreadID}}#post{{.PostID}}">{{.FromName}} 回复了你的主题</a>
							{{else}}<a href="{{threadURL .ThreadID}}#post{{.PostID}}">{{.FromName}} 提到了你</a>{{end}}
							<p class="excerpt">{{.Excerpt}}</p>
						</th>
						<td class="by xg1">{{timefmt .CreatedAt}}</td>
					</tr>
					{{end}}
				</table>
				{{else}}
				<p class="xg1">还没有收到通知。当别人回复你的主题或在帖子里 @你 时，这里会出现提醒。</p>
				{{end}}
			</div>
		</div>
	</div>
</div>
{{end}}
