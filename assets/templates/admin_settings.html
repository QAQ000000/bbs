{{define "content"}}
<div class="admin-head"><h2>站点设置</h2></div>

<div class="panel">
	<form method="post" action="/admin/settings" class="settings-form">
		<input type="hidden" name="_csrf" value="{{.CSRF}}">
		<table class="kv form-kv">
			<tr>
				<th>站点名称</th>
				<td><input type="text" name="site_name" value="{{.Settings.SiteName}}" class="px px-inline" required></td>
			</tr>
			<tr>
				<th>版块页每页主题数</th>
				<td><input type="number" name="threads_per_page" value="{{.Settings.ThreadsPerPage}}" min="5" max="100" class="px px-inline px-num"></td>
			</tr>
			<tr>
				<th>帖子页每页楼层数</th>
				<td><input type="number" name="posts_per_page" value="{{.Settings.PostsPerPage}}" min="5" max="100" class="px px-inline px-num"></td>
			</tr>
			<tr>
				<th>开放注册</th>
				<td><label><input type="checkbox" name="register_enabled" value="1"{{if .Settings.RegisterEnabled}} checked{{end}}> 允许新用户注册</label></td>
			</tr>
			<tr>
				<th>发帖审核</th>
				<td><label><input type="checkbox" name="moderate_enabled" value="1"{{if .Settings.ModerateEnabled}} checked{{end}}> 新用户发的主题与回复需管理员或版主审核后公开（管理员与版主本人不受限）</label></td>
			</tr>
			<tr>
				<th>注册验证码</th>
				<td><label><input type="checkbox" name="captcha_enabled" value="1"{{if .Settings.CaptchaEnabled}} checked{{end}}> 注册时需输入算术验证码（自绘 SVG，零第三方依赖）</label></td>
			</tr>
			<tr>
				<th>邮箱验证</th>
				<td><label><input type="checkbox" name="email_verify_enabled" value="1"{{if .Settings.EmailVerifyEnabled}} checked{{end}}> 新注册邮箱需验证；未验证者发布外链内容进审核队列（SMTP 未启用时自动失效）</label></td>
			</tr>
			<tr>
				<th>本站上传</th>
				<td>
					<label><input type="checkbox" name="upload_enabled" value="1"{{if .Settings.UploadEnabled}} checked{{end}}> 开放图片/附件上传到本站（关闭 = 仅外链模式）</label>
					<p class="xg1 tip">图片上限
						<input type="number" name="max_image_mb" value="{{.Settings.MaxImageMB}}" min="1" max="1024" class="px px-inline px-num"> MB，
						附件上限
						<input type="number" name="max_file_mb" value="{{.Settings.MaxFileMB}}" min="1" max="1024" class="px px-inline px-num"> MB</p>
				</td>
			</tr>
			<tr>
				<th>关闭站点</th>
				<td>
					<label><input type="checkbox" name="site_closed" value="1"{{if .Settings.SiteClosed}} checked{{end}}> 暂时关闭站点（后台与登录不受影响）</label>
					<input type="text" name="site_closed_reason" value="{{.Settings.SiteClosedReason}}" class="px px-inline px-wide" placeholder="关闭原因，展示给访客">
				</td>
			</tr>
		</table>
		<div class="submit-row">
			<button type="submit" class="pn pnc">保存设置</button>
			{{if .Saved}}<span class="xg1">已保存（{{.Settings.SiteName}}）</span>{{end}}
		</div>
	</form>
</div>
{{end}}
