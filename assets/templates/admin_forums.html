{{define "content"}}
<div class="admin-head"><h2>版块管理</h2></div>

{{range .Categories}}
<div class="panel cat-panel">
	<div class="cat-row cl">
		<form method="post" action="/admin/cats/save" class="cl z">
			<input type="hidden" name="_csrf" value="{{$.CSRF}}">
			<input type="hidden" name="id" value="{{.ID}}">
			<input type="text" name="name" value="{{.Name}}" class="px px-inline" required>
			<button type="submit" class="pn pn-sm">改名</button>
		</form>
		<form method="post" action="/admin/cats/delete" class="y" data-confirm="确定删除分类「{{.Name}}」吗？">
			<input type="hidden" name="_csrf" value="{{$.CSRF}}">
			<input type="hidden" name="id" value="{{.ID}}">
			<button type="submit" class="pn pn-sm pn-danger">删除分类</button>
		</form>
	</div>

	<table class="admin-table">
		<thead><tr><th>排序</th><th>版块</th><th>简介</th><th>主题/帖子</th><th>操作</th></tr></thead>
		<tbody>
		{{range .Forums}}
		<tr>
			<td class="ops">
				<form method="post" action="/admin/forums/move" class="inlineform"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="dir" value="up"><button type="submit" class="pn pn-sm" title="上移">↑</button></form>
				<form method="post" action="/admin/forums/move" class="inlineform"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="dir" value="down"><button type="submit" class="pn pn-sm" title="下移">↓</button></form>
			</td>
			<td class="edit-cell">
				<form method="post" action="/admin/forums/save" id="fs{{.ID}}" class="cl">
					<input type="hidden" name="_csrf" value="{{$.CSRF}}">
					<input type="hidden" name="id" value="{{.ID}}">
					<input type="hidden" name="category_id" value="{{.CategoryID}}">
					<input type="text" name="name" value="{{.Name}}" class="px px-inline" required>
				</form>
			</td>
			<td class="edit-cell">
				<input type="text" name="description" value="{{.Description}}" class="px px-inline" form="fs{{.ID}}">
				<input type="text" name="moderators" value="{{.Moderators}}" class="px px-inline" form="fs{{.ID}}" placeholder="版主（逗号分隔用户名）">
			</td>
			<td class="xg1">{{.ThreadCount}} / {{.PostCount}}</td>
			<td class="ops">
				<button type="submit" form="fs{{.ID}}" class="pn pn-sm">保存</button>
				<a href="{{forumURL .ID}}" target="_blank">查看</a>
				<form method="post" action="/admin/forums/delete" class="inlineform" data-confirm="确定删除版块「{{.Name}}」吗？（仅可删除无主题的版块）">
					<input type="hidden" name="_csrf" value="{{$.CSRF}}">
					<input type="hidden" name="id" value="{{.ID}}">
					<button type="submit" class="pn pn-sm pn-danger">删除</button>
				</form>
			</td>
		</tr>
		{{end}}
		</tbody>
	</table>
</div>
{{end}}

<div class="admin-grid cl">
	<div class="panel z">
		<h3>新增分类</h3>
		<form method="post" action="/admin/cats/save" class="inline-form">
			<input type="hidden" name="_csrf" value="{{.CSRF}}">
			<input type="hidden" name="id" value="0">
			<input type="text" name="name" class="px px-inline" placeholder="分类名称" required>
			<button type="submit" class="pn pnc pn-sm">添加</button>
		</form>
	</div>
	<div class="panel z">
		<h3>新增版块</h3>
		<form method="post" action="/admin/forums/save" class="inline-form">
			<input type="hidden" name="_csrf" value="{{.CSRF}}">
			<input type="hidden" name="id" value="0">
			<select name="category_id" class="px px-inline">
				{{range .Categories}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
			</select>
			<input type="text" name="name" class="px px-inline" placeholder="版块名称" required>
			<input type="text" name="description" class="px px-inline px-wide" placeholder="简介（选填）">
			<input type="text" name="moderators" class="px px-inline" placeholder="版主（选填）">
			<button type="submit" class="pn pnc pn-sm">添加</button>
		</form>
	</div>
</div>
{{end}}
